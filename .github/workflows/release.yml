name: Release

# Build the shadow (fat) jars and publish them.
#   - Push a tag `v*`  -> jars are attached to a GitHub Release.
#   - Manual dispatch  -> jars are uploaded as a workflow artifact (no release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Build Cassandra Analytics
        run: bin/build-cassandra-analytics

      - name: Build fat jars
        run: ./gradlew shadowJar --no-daemon

      - name: Collect fat jars
        run: |
          mkdir -p release-jars
          find . -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp {} release-jars/ \;
          ls -la release-jars

      - name: Upload jars as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fat-jars
          path: release-jars/*.jar

      - name: Attach jars to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
